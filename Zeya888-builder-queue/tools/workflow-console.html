<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workflow</title>
  <style>
    :root {
      --bg-primary: #0a1420;
      --bg-panel: #181715;
      --bg-panel-hover: #1f1d1a;
      --doge-gold: #eca125;
      --doge-light-gold: #fce3ae;
      --text-primary: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2d3748;
      --phase-wave: #eca125;
      --phase-p1: #3b82f6;
      --phase-p2: #10b981;
      --phase-p3: #3b82f6;
      --phase-p4: #f59e0b;
      --phase-p5: #8b5cf6;
      --phase-p6: #059669;
      --phase-p7: #d97706;
      --phase-p8: #f97316;
      --error: #ef4444;
      --success: #22c55e;
      --token-var: #eca125;
      --token-project: #10b981;
      --token-cli: #60a5fa;
      --font-ui: "Inter", system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
      --max-width: 1320px;
      --outer-pad: 48px;
      --header-h: 72px;
      --accordion-gap: 20px;
      --input-h: 36px;
      --cli-h: 40px;
      --transition-fast: 100ms ease;
      --transition-accordion: 150ms ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-ui);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
    }

    .page {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: var(--outer-pad);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: var(--header-h);
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .header__brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header__logo {
      font-size: 28px;
      line-height: 1;
    }

    .header__title {
      font-size: 24px;
      font-weight: 600;
    }

    .header__subtitle {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .header__pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--doge-light-gold);
    }

    .prompt-blocks {
      display: flex;
      flex-direction: column;
      gap: var(--accordion-gap);
    }

    .prompt-block {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .prompt-block__header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
      transition: background var(--transition-fast);
    }

    .prompt-block__header:hover {
      background: var(--bg-panel-hover);
    }

    .prompt-block__header:focus-visible {
      outline: 2px solid var(--phase-p1);
      outline-offset: -2px;
    }

    .phase-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      color: #fff;
      flex-shrink: 0;
    }

    .prompt-block__title {
      flex: 1;
      font-size: 18px;
      font-weight: 600;
    }

    .chevron {
      color: var(--text-muted);
      transition: transform var(--transition-accordion);
      font-size: 12px;
    }

    .prompt-block.is-collapsed .chevron {
      transform: rotate(-90deg);
    }

    .prompt-block.is-collapsed .prompt-block__body {
      display: none;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      min-height: 32px;
      padding: 4px;
      border: none;
      background: transparent;
      color: var(--doge-gold);
      cursor: pointer;
      border-radius: 4px;
      transition: background var(--transition-fast), color var(--transition-fast);
    }

    .copy-btn:hover {
      background: rgba(236, 161, 37, 0.15);
    }

    .copy-btn:focus-visible {
      outline: 2px solid var(--doge-gold);
    }

    .copy-btn.is-copied {
      color: var(--success);
    }

    .copy-btn__label {
      font-size: 11px;
      margin-left: 4px;
      display: none;
    }

    .copy-btn.is-copied .copy-btn__label {
      display: inline;
    }

    .prompt-block__body {
      padding: 0 16px 16px;
      border-top: 1px solid var(--border);
    }

    .page-operator-fields {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      padding: 20px 0 24px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .page-operator-fields .field-section-title {
      grid-column: 1 / -1;
      font-size: 13px;
      font-weight: 600;
      color: var(--doge-light-gold);
      margin-bottom: 4px;
    }

    .field--path {
      grid-column: 1 / -1;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .field input,
    .field select {
      width: 100%;
      height: var(--input-h);
      padding: 0 10px;
      font-family: var(--font-mono);
      font-size: 13px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      transition: border-color var(--transition-fast);
    }

    .field-input-wrap {
      position: relative;
    }

    .field-input-wrap input {
      padding-right: 32px;
    }

    .field-clear {
      display: none;
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: var(--border);
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      transition: background var(--transition-fast), color var(--transition-fast);
    }

    .field-clear.is-visible {
      display: flex;
    }

    .field-clear:hover {
      background: var(--text-muted);
      color: var(--bg-primary);
    }

    .field-clear:focus-visible {
      outline: 2px solid var(--phase-p1);
      outline-offset: 1px;
    }

    .field input:hover,
    .field select:hover {
      border-color: var(--text-muted);
    }

    .field input:focus,
    .field select:focus {
      outline: none;
      border-color: var(--phase-p1);
    }

    .field.field-empty input,
    .field.field-empty select {
      border-color: var(--error);
    }

    .prompt-pre {
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      color: var(--text-primary);
    }

    .cli-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
    }

    .cli-section__title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--doge-light-gold);
    }

    .cli-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: var(--cli-h);
      margin-bottom: 8px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 8px 0 12px;
    }

    .cli-row code {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text-primary);
    }

    .tok-var { color: var(--token-var); }
    .tok-project { color: var(--token-project); }
    .tok-cli { color: var(--token-cli); }
    .tok-path { color: var(--text-primary); }
    .tok-comment { color: var(--text-muted); }

    .cli-section--only {
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }

    .prompt-step-fields {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
      padding: 12px 0 8px;
      border-bottom: 1px dashed var(--border);
      margin-bottom: 12px;
    }

    .prompt-step-fields--mockups {
      grid-template-columns: 1fr;
    }

    .mockup-field-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mockup-field-group__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .mockup-field-group__label {
      font-size: 12px;
      color: var(--text-muted);
    }

    .field-add-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: transparent;
      color: var(--doge-gold);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
      transition: background var(--transition-fast), border-color var(--transition-fast);
    }

    .field-add-btn:hover {
      background: rgba(236, 161, 37, 0.15);
      border-color: var(--doge-gold);
    }

    .field-add-btn:focus-visible {
      outline: 2px solid var(--phase-p1);
    }

    .mockup-field-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mockup-field-row .field-input-wrap {
      flex: 1;
      min-width: 0;
    }

    .field-remove-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: transparent;
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
      transition: background var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
    }

    .field-remove-btn:hover {
      background: rgba(220, 80, 80, 0.15);
      border-color: var(--error);
      color: var(--error);
    }

    .field-remove-btn:focus-visible {
      outline: 2px solid var(--phase-p1);
    }

    .mockup-field-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mockup-field-list .field {
      margin: 0;
    }

    .prompt-hint {
      margin-top: 12px;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(236, 161, 37, 0.08);
      border: 1px dashed var(--border);
      border-radius: 6px;
    }
  </style>
</head>

@.cursor/rules/builder-operator-habits.mdc
@.cursor/rules/analysis.mdc

input_mode=backlog_story. @$storyFile

Epic/task naming и materialize: $p13Appendix (operator contract §6 для spa или identity).

      const atEq = new RegExp(`@\\$${varName}=`, 'g');
      const atPlain = new RegExp(`@\\$${varName}(?![\\w=])`, 'g');
      const eqForm = new RegExp(`(?<![@])\\$${varName}=`, 'g');
      const standalone = new RegExp(`\\$${varName}(?![\\w=])`, 'g');

      if (hasValue) {
        out = out.replace(atEq, `@$${varName}=${v}`);
        out = out.replace(atPlain, `@${v}`);
        out = out.replace(eqForm, `$${varName}=${v}`);
        out = out.replace(standalone, v);
      }
      return out;
    }

    function substituteDerived(text, profile) {
      const p = profile.project;
      const base = 'python3 docs/methodology/Zeya888-builder-queue/cli/builder_resolve_queue.py';
      return text
        .replace(/\$builderProject/g, p)
        .replace(/\$tasksRoot/g, profile.tasks_dir)
        .replace(/\$verifyCmd/g, `${base} --project ${p} --verify`)
        .replace(/\$verifyDatesCmd/g, `${base} --project ${p} --verify --check-dates`)
        .replace(/\$printUtcNowCmd/g, `${base} --print-utc-now`)
        .replace(/\$executionSkillPath/g, profile.execution_skill_path)
        .replace(
          /\$executionSkillDeclared/g,
          `Skill declared: ${profile.execution_skill_primary}`,
        )
        .replace(/\$currentPointer/g, `${profile.tasks_dir}/${profile.current_pointer}`)
        .replace(/\$uiVisualPipelineDoc/g, profile.ui_visual_pipeline_doc || '$uiVisualPipelineDoc')
        .replace(/\$uiPipelineDoc/g, profile.pipeline_doc || '$uiPipelineDoc');
    }

    function postProcessP3Ux(text, values) {
      const specs = values.mockupSpecs || [];
      const imgs = values.mockupImgs || [];
      const paths = [...specs, ...imgs];
      const block = paths.length > 0
        ? paths.map((p) => `@mockup: ${p}`).join('\n')
        : P3_UX_MOCKUP_BLOCK;
      let out = text.replace(P3_UX_MOCKUP_BLOCK, block);
      if (specs[0]) out = substituteToken(out, 'mockupSpec', specs[0]);
      if (imgs[0]) out = substituteToken(out, 'mockupImg', imgs[0]);
      return out;
    }

    function postProcessP8(text, values) {
      const key = (values.storyKey || '').trim();
      if (!key) return text;
      let out = substituteToken(text, 'anchor', key);
      out = out.replace(/\(\$anchor\)/g, `(\`${key}\`)`);
      return out;
    }

    function postProcessWave(text, values) {
      const p = (values.builder_project || 'scripts').trim();
      return text.replace(/builder_project:\s*\w+/g, `builder_project: ${p}`);
    }

    function getProfile(project) {
      const p = (project || '').trim();
      return PROJECT_PROFILES[p] || PROJECT_PROFILES.scripts;
    }

    function applyTokenAliases(out, meta, value) {
      if (!meta?.token || !value?.trim()) return out;
      let result = substituteToken(out, meta.token, value);
      for (const alias of meta.aliasTokens || []) {
        result = substituteToken(result, alias, value);
      }
      return result;
    }

    function substituteAllTokens(text, values) {
      let out = text;
      for (const key of PAGE_FIELD_KEYS) {
        const meta = PAGE_FIELD_META[key];
        if (meta?.token) {
          out = applyTokenAliases(out, meta, values[key]);
        }
      }
      for (const key of Object.keys(PROMPT_FIELD_META)) {
        const meta = PROMPT_FIELD_META[key];
        if (meta?.token) {
          out = applyTokenAliases(out, meta, values[key]);
        }
      }
      return out;
    }

    function buildPromptText(blockId, template, values) {
      const profile = getProfile(values.builder_project);
      let text = substituteAllTokens(template, values);
      text = substituteDerived(text, profile);
      if (blockId === 'wave') text = postProcessWave(text, values);
      if (blockId === 'p3Ux') text = postProcessP3Ux(text, values);
      if (blockId === 'p8') text = postProcessP8(text, values);
      return text;
    }

    function getPageValues() {
      const values = {};
      const panel = document.getElementById('page-operator-fields');
      panel.querySelectorAll('[data-page-field]').forEach((input) => {
        values[input.dataset.pageField] = input.value;
      });
      return values;
    }

    function getPromptValues(blockEl) {
      const values = {};
      if (!blockEl) return values;
      blockEl.querySelectorAll('[data-prompt-field]').forEach((input) => {
        values[input.dataset.promptField] = input.value;
      });
      return values;
    }

    function getMockupValues(blockEl) {
      const specs = [];
      const imgs = [];
      if (!blockEl) return { mockupSpecs: specs, mockupImgs: imgs };
      blockEl.querySelectorAll('input[data-mockup-kind="spec"]').forEach((inp) => {
        const v = inp.value.trim();
        if (v) specs.push(v);
      });
      blockEl.querySelectorAll('input[data-mockup-kind="img"]').forEach((inp) => {
        const v = inp.value.trim();
        if (v) imgs.push(v);
      });
      return { mockupSpecs: specs, mockupImgs: imgs };
    }

    function getValuesForBlock(blockId, blockEl) {
      const values = { ...getPageValues(), ...getPromptValues(blockEl) };
      if (blockId === 'p3Ux' && blockEl) {
        const mockup = getMockupValues(blockEl);
        values.mockupSpecs = mockup.mockupSpecs;
        values.mockupImgs = mockup.mockupImgs;
      }
      return values;
    }

    function highlightPageEmptyFields(fieldKeys) {
      const panel = document.getElementById('page-operator-fields');
      panel.querySelectorAll('.field').forEach((f) => f.classList.remove('field-empty'));
      for (const key of fieldKeys) {
        const meta = PAGE_FIELD_META[key];
        if (!meta?.token) continue;
        const input = panel.querySelector(`[data-page-field="${key}"]`);
        if (!input || input.value.trim()) continue;
        input.closest('.field')?.classList.add('field-empty');
      }
    }

    function highlightPromptEmptyFields(blockEl, fieldKeys) {
      if (!blockEl) return;
      blockEl.querySelectorAll('.prompt-step-fields .field').forEach((f) => {
        f.classList.remove('field-empty');
      });
      for (const key of fieldKeys) {
        const meta = PROMPT_FIELD_META[key];
        if (!meta || meta.optional) continue;
        const input = blockEl.querySelector(`[data-prompt-field="${key}"]`);
        if (!input || input.value.trim()) continue;
        input.closest('.field')?.classList.add('field-empty');
      }
    }

    const blockRegistry = [];

    function refreshBlockPreview(blockEl, block) {
      if (!block.text) return;
      const pre = blockEl.querySelector('.prompt-pre');
      if (!pre) return;
      const values = getValuesForBlock(block.id, blockEl);
      const text = buildPromptText(block.id, block.text, values);
      pre.innerHTML = highlightTokens(escapeHtml(text));
    }

    function refreshAllPreviews() {
      for (const { el, block } of blockRegistry) {
        refreshBlockPreview(el, block);
      }
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_) {
        /* fallback below */
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }

    function showCopiedFeedback(btn) {
      btn.classList.add('is-copied');
      const prev = btn.getAttribute('aria-label');
      btn.setAttribute('aria-label', 'Copied');
      setTimeout(() => {
        btn.classList.remove('is-copied');
        btn.setAttribute('aria-label', prev || 'Copy');
      }, 1300);
    }

    function buildCliCommands(project, windowFlatEnd) {
      const base = 'python3 docs/methodology/Zeya888-builder-queue/cli/builder_resolve_queue.py';
      const p = (project && project.trim()) || 'scripts';
      const end = (windowFlatEnd && String(windowFlatEnd).trim()) || 'X';
      return [
        { slug: 'verify', cmd: `${base} --project ${p} --verify` },
        { slug: 'verify-dates', cmd: `${base} --project ${p} --verify --check-dates` },
        { slug: 'print-utc', cmd: `${base} --print-utc-now` },
        { slug: 'list', cmd: `${base} --project ${p} --list` },
        {
          slug: 'build-window',
          cmd: `${base} --project ${p} --write-build-window --window-flat-start 1 --window-flat-end ${end}`,
        },
      ];
    }

    function renderCliSection(cliOnly, blockEl) {
      const section = document.createElement('div');
      section.className = cliOnly ? 'cli-section cli-section--only' : 'cli-section';
      section.innerHTML = '<div class="cli-section__title">CLI commands</div>';
      const pageValues = getPageValues();
      const promptValues = getPromptValues(blockEl);
      const commands = buildCliCommands(
        pageValues.builder_project,
        promptValues.windowFlatEnd,
      );
      for (const { slug, cmd } of commands) {
        const row = document.createElement('div');
        row.className = 'cli-row';
        row.dataset.testid = `cli-row-${slug}`;
        const code = document.createElement('code');
        code.textContent = cmd;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'copy-btn';
        btn.setAttribute('aria-label', 'Copy CLI command');
        btn.innerHTML = COPY_ICON + '<span class="copy-btn__label">Copied</span>';
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          await copyText(cmd);
          showCopiedFeedback(btn);
        });
        row.appendChild(code);
        row.appendChild(btn);
        section.appendChild(row);
      }
      return section;
    }

    function wrapTextInputWithClear(input) {
      const wrap = document.createElement('div');
      wrap.className = 'field-input-wrap';
      const clearBtn = document.createElement('button');
      clearBtn.type = 'button';
      clearBtn.className = 'field-clear';
      clearBtn.setAttribute('aria-label', 'Clear field');
      clearBtn.textContent = '×';

      function syncClearVisibility() {
        clearBtn.classList.toggle('is-visible', input.value.length > 0);
      }

      clearBtn.addEventListener('click', (e) => {
        e.preventDefault();
        input.value = '';
        syncClearVisibility();
        input.dispatchEvent(new Event('input', { bubbles: true }));
      });

      input.addEventListener('input', syncClearVisibility);
      syncClearVisibility();

      wrap.appendChild(input);
      wrap.appendChild(clearBtn);
      return wrap;
    }

    function renderPromptField(blockId, key) {
      const meta = PROMPT_FIELD_META[key];
      const field = document.createElement('div');
      field.className = 'field';
      if (meta.wide) field.classList.add('field--path');
      field.dataset.testid = `prompt-field-${blockId}-${key}`;
      const label = document.createElement('label');
      label.textContent = meta.label;
      label.setAttribute('for', `prompt-field-input-${blockId}-${key}`);
      let input;
      if (meta.type === 'number') {
        input = document.createElement('input');
        input.type = 'number';
        input.min = '1';
      } else {
        input = document.createElement('input');
        input.type = 'text';
      }
      input.id = `prompt-field-input-${blockId}-${key}`;
      input.dataset.promptField = key;
      input.autocomplete = 'off';
      field.appendChild(label);
      if (meta.type === 'number') {
        field.appendChild(input);
      } else {
        field.appendChild(wrapTextInputWithClear(input));
      }
      return field;
    }

    function renderPromptStepFields(blockId, blockEl) {
      const keys = BLOCK_PROMPT_FIELDS[blockId];
      if (!keys || keys.length === 0) return null;
      const wrap = document.createElement('div');
      wrap.className = 'prompt-step-fields';
      for (const key of keys) {
        wrap.appendChild(renderPromptField(blockId, key));
      }
      wrap.querySelectorAll('input').forEach((inp) => {
        inp.addEventListener('input', () => {
          const block = blockRegistry.find((b) => b.el === blockEl)?.block;
          if (block?.cliOnly) {
            refreshP2Cli();
          } else {
            refreshBlockPreview(blockEl, block);
          }
        });
        inp.addEventListener('change', () => {
          const block = blockRegistry.find((b) => b.el === blockEl)?.block;
          if (block?.cliOnly) {
            refreshP2Cli();
          } else {
            refreshBlockPreview(blockEl, block);
          }
        });
      });
      return wrap;
    }

    function wireMockupInput(input, blockEl) {
      input.addEventListener('input', () => {
        const block = blockRegistry.find((b) => b.el === blockEl)?.block;
        refreshBlockPreview(blockEl, block);
      });
      input.addEventListener('change', () => {
        const block = blockRegistry.find((b) => b.el === blockEl)?.block;
        refreshBlockPreview(blockEl, block);
      });
    }

    function appendMockupRow(listEl, kind, blockEl) {
      const isFirst = listEl.querySelectorAll('.mockup-field-row').length === 0;
      const field = document.createElement('div');
      field.className = 'field field--path mockup-field-row';
      const input = document.createElement('input');
      input.type = 'text';
      input.dataset.mockupKind = kind;
      input.autocomplete = 'off';
      field.appendChild(wrapTextInputWithClear(input));
      if (!isFirst) {
        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'field-remove-btn';
        removeBtn.dataset.testid = kind === 'spec' ? 'mockup-remove-spec' : 'mockup-remove-img';
        removeBtn.setAttribute('aria-label', `Remove ${kind} mockup field`);
        removeBtn.textContent = '−';
        removeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          field.remove();
          const block = blockRegistry.find((b) => b.el === blockEl)?.block;
          refreshBlockPreview(blockEl, block);
        });
        field.appendChild(removeBtn);
      }
      listEl.appendChild(field);
      wireMockupInput(input, blockEl);
      return input;
    }

    function renderMockupGroup(kind, label, testId, blockEl) {
      const group = document.createElement('div');
      group.className = 'mockup-field-group';
      const header = document.createElement('div');
      header.className = 'mockup-field-group__header';
      const labelEl = document.createElement('span');
      labelEl.className = 'mockup-field-group__label';
      labelEl.textContent = label;
      const list = document.createElement('div');
      list.className = 'mockup-field-list';
      list.dataset.mockupKind = kind;
      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'field-add-btn';
      addBtn.dataset.testid = testId;
      addBtn.setAttribute('aria-label', `Add ${kind} mockup field`);
      addBtn.textContent = '+';
      addBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        appendMockupRow(list, kind, blockEl);
      });
      header.appendChild(labelEl);
      header.appendChild(addBtn);
      group.appendChild(header);
      group.appendChild(list);
      appendMockupRow(list, kind, blockEl);
      return group;
    }

    function renderP3UxMockupFields(blockEl) {
      const wrap = document.createElement('div');
      wrap.className = 'prompt-step-fields prompt-step-fields--mockups';
      wrap.appendChild(renderMockupGroup('spec', '@$mockupSpec=', 'mockup-add-spec', blockEl));
      wrap.appendChild(renderMockupGroup('img', '@$mockupImg=', 'mockup-add-img', blockEl));
      return wrap;
    }

    function renderPageField(key) {
      const meta = PAGE_FIELD_META[key];
      const field = document.createElement('div');
      field.className = 'field';
      if (meta.wide) field.classList.add('field--path');
      field.dataset.testid = key === 'builder_project' ? 'page-builder-project' : `page-field-${key}`;
      const label = document.createElement('label');
      label.textContent = meta.label;
      label.setAttribute('for', `page-field-input-${key}`);
      let input;
      if (meta.type === 'select') {
        input = document.createElement('select');
        input.id = `page-field-input-${key}`;
        input.dataset.pageField = key;
        for (const opt of BUILDER_PROJECTS) {
          const o = document.createElement('option');
          o.value = opt;
          o.textContent = opt;
          input.appendChild(o);
        }
        input.value = 'scripts';
        field.appendChild(label);
        field.appendChild(input);
      } else {
        input = document.createElement('input');
        input.type = 'text';
        input.id = `page-field-input-${key}`;
        input.dataset.pageField = key;
        input.autocomplete = 'off';
        field.appendChild(label);
        field.appendChild(wrapTextInputWithClear(input));
      }
      return field;
    }

    function renderPageFields() {
      const panel = document.getElementById('page-operator-fields');
      for (const key of PAGE_FIELD_KEYS) {
        panel.appendChild(renderPageField(key));
      }
      const projectSelect = panel.querySelector('[data-page-field="builder_project"]');
      projectSelect.addEventListener('change', () => {
        applyProjectProfile(projectSelect.value);
        refreshP2Cli();
        refreshAllPreviews();
      });
      panel.querySelectorAll('[data-page-field]').forEach((inp) => {
        if (inp.dataset.pageField === 'builder_project') return;
        inp.addEventListener('input', refreshAllPreviews);
        inp.addEventListener('change', refreshAllPreviews);
      });
    }

    function applyProjectProfile(project) {
      const profile = getProfile(project);
      const planInput = document.querySelector('[data-page-field="planFile"]');
      if (planInput && profile.plan_file) {
        planInput.value = profile.plan_file;
        planInput.dispatchEvent(new Event('input', { bubbles: true }));
      }
      if (profile.backlog_index) {
        for (const id of ['p13', 'p13Ux', 'p13UxReady']) {
          const el = document.querySelector(`[data-testid="prompt-block-${id}"]`);
          const inp = el?.querySelector('[data-prompt-field="backlogIndex"]');
          if (inp) {
            inp.value = profile.backlog_index;
            inp.dispatchEvent(new Event('input', { bubbles: true }));
          }
        }
      }
      for (const id of ['p4', 'p4Ux']) {
        const p4Inp = document.querySelector(`[data-testid="prompt-block-${id}"] [data-prompt-field="bullrun"]`);
        if (p4Inp) {
          p4Inp.value = `${profile.tasks_dir}/bullrun-launch-index.md`;
          p4Inp.dispatchEvent(new Event('input', { bubbles: true }));
        }
      }
    }

    function setBlockCollapsed(blockId, collapsed) {
      const el = document.querySelector(`[data-testid="prompt-block-${blockId}"]`);
      if (!el) return;
      const header = el.querySelector('.prompt-block__header');
      if (collapsed) {
        el.classList.add('is-collapsed');
        header?.setAttribute('aria-expanded', 'false');
      } else {
        el.classList.remove('is-collapsed');
        header?.setAttribute('aria-expanded', 'true');
      }
    }

    let p2BlockEl = null;
    let p2BodyEl = null;

    function refreshP2Cli() {
      if (!p2BlockEl || !p2BodyEl) return;
      const old = p2BodyEl.querySelector('.cli-section');
      if (old) old.remove();
      p2BodyEl.appendChild(renderCliSection(true, p2BlockEl));
    }

    function renderBlocks() {
      const root = document.getElementById('prompt-blocks');
      for (const block of PROMPTS) {
        const el = document.createElement('article');
        el.className = 'prompt-block is-collapsed';
        el.dataset.testid = `prompt-block-${block.id}`;

        const header = document.createElement('div');
        header.className = 'prompt-block__header';
        header.tabIndex = 0;
        header.setAttribute('role', 'button');
        header.setAttribute('aria-expanded', 'false');

        const badge = document.createElement('span');
        badge.className = 'phase-badge';
        badge.textContent = block.phase;
        badge.style.background = PHASE_COLORS[block.phaseColor] || '#eca125';

        const title = document.createElement('span');
        title.className = 'prompt-block__title';
        title.textContent = block.label;

        const chevron = document.createElement('span');
        chevron.className = 'chevron';
        chevron.textContent = '▼';
        chevron.setAttribute('aria-hidden', 'true');

        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'copy-btn';
        copyBtn.dataset.testid = `copy-prompt-${block.id}`;
        copyBtn.setAttribute('aria-label', 'Copy prompt');
        copyBtn.innerHTML = COPY_ICON + '<span class="copy-btn__label">Copied</span>';
        if (block.cliOnly) copyBtn.hidden = true;

        header.appendChild(badge);
        header.appendChild(title);
        header.appendChild(chevron);
        header.appendChild(copyBtn);

        const body = document.createElement('div');
        body.className = 'prompt-block__body';

        const promptFields = renderPromptStepFields(block.id, el);
        if (promptFields) body.appendChild(promptFields);
        if (block.id === 'p3Ux') {
          body.appendChild(renderP3UxMockupFields(el));
        }

        if (block.cliOnly) {
          p2BlockEl = el;
          p2BodyEl = body;
          body.appendChild(renderCliSection(true, el));
        } else {
          const pre = document.createElement('pre');
          pre.className = 'prompt-pre';
          body.appendChild(pre);
        }

        if (block.hint) {
          const hint = document.createElement('div');
          hint.className = 'prompt-hint';
          hint.textContent = block.hint;
          body.appendChild(hint);
        }

        el.appendChild(header);
        el.appendChild(body);
        root.appendChild(el);
        blockRegistry.push({ el, block });

        const toggle = () => {
          const collapsed = el.classList.toggle('is-collapsed');
          header.setAttribute('aria-expanded', String(!collapsed));
        };

        header.addEventListener('click', (e) => {
          if (e.target.closest('.copy-btn')) return;
          toggle();
        });
        header.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            if (!e.target.closest('.copy-btn')) toggle();
          }
        });

        copyBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (block.cliOnly) return;
          highlightPageEmptyFields(BLOCK_PAGE_FIELDS[block.id] || []);
          highlightPromptEmptyFields(el, BLOCK_PROMPT_FIELDS[block.id] || []);
          const values = getValuesForBlock(block.id, el);
          const text = buildPromptText(block.id, block.text, values);
          await copyText(text);
          showCopiedFeedback(copyBtn);
        });
      }
    }

    function init() {
      renderPageFields();
      renderBlocks();
      const project = getPageValues().builder_project || 'scripts';
      applyProjectProfile(project);
      refreshAllPreviews();
    }

    init();
  </script>
</body>
</html>
