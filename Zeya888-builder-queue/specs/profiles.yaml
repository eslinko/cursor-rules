      - doge-complaints-gateway/scripts/taxonomy_apply_gateway.py
      - doge-complaints-gateway/scripts/taxonomy_apply_spa_i18n.py
      - doge-complaints-gateway/docs/runtime-docs/appendix/taxonomy-decisions-schema.md
      - doge-complaints-gateway/docs/tasks/run-reports/taxonomy-cycles/README.md
    stack_label: Python (scripts)
    execution_skill_primary: python-pro
    execution_skill_path: .cursor/skills/sources/jeffallan-claude-skills/skills/python-pro/SKILL.md

