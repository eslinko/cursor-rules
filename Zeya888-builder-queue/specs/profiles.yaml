    input_package_yaml_key: gateway_input_package
    artifact_kind: gateway_cursor_build_window
    build_window_title: Gateway Cursor build window
    test_command: "cd doge-complaints-gateway && python3 -m pytest -q"
    stack_label: Python
    execution_skill_primary: python-pro
    execution_skill_path: .cursor/skills/sources/jeffallan-claude-skills/skills/python-pro/SKILL.md

  gpt:
