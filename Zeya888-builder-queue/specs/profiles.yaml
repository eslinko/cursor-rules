# Реестр Builder Queue — SSOT путей для builder_resolve_queue.py, workflow, starter.
# Ключ --project в CLI должен совпадать с именем профиля ниже.

projects:
  gateway:
    enabled: true
    focus_folder: doge-complaints-gateway
    tasks_dir: doge-complaints-gateway/docs/tasks
    active_packages_dir: gateway-active-packages
    current_pointer: gateway-active-package.current.yaml
    build_windows_subdir: run-reports/gateway-build-windows
    build_window_prefix: gateway-cursor-build-window
    next_readme_dotfile: .gateway-next-readme
    pkg_path_prefix: doge-complaints-gateway/docs/tasks/
    plan_file: .cursor/plans/Gateway_builder.plan.md
